services:
  # Laravel Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: si-tracer-app
    container_name: si-tracer-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PASSWORD=
    networks:
      - si-tracer-network
    depends_on:
      - db

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: si-tracer-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - si-tracer-network
    depends_on:
      - app

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: si-tracer-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=tracer_revisi
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - dbdata:/var/lib/mysql
      # Auto-import database dump on first container startup
      - ./tracer.sql:/docker-entrypoint-initdb.d/tracer.sql
    networks:
      - si-tracer-network

  # Node/Vite (Asset compilation)
  node:
    image: node:18-alpine
    container_name: si-tracer-node
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "5173:5173"
    command: npm run dev -- --host
    networks:
      - si-tracer-network

networks:
  si-tracer-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
